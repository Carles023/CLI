[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsort"
version = "1.0.0"
description = "CLI para organizar, deduplicar, limpiar, sincronizar y resumir archivos, configurable via actions.json"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cartudgar" }]
keywords = ["cli", "archivos", "organizar", "extensions", "duplicados", "limpieza", "snapshots"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fsort = "fsort.__main__:main"

[tool.setuptools]
packages = ["fsort"]

[tool.setuptools.package-data]
fsort = ["actions.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
